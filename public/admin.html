```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyHub NG - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        /* HEADER */
        header {
            background: #102a43;
            color: white;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #adminName {
            font-size: 14px;
            color: #d9e7f5;
        }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* PAGE */
        .container {
            width: min(1200px, 94%);
            margin: 30px auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #64748b;
        }

        /* STATS */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 15px rgba(15, 23, 42, 0.08);
        }

        .stat-card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .stat-card strong {
            font-size: 30px;
            color: #102a43;
        }

        /* CARD */
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 15px rgba(15, 23, 42, 0.08);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #102a43;
        }

        /* FORM */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0284c7;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .primary-btn {
            background: #0284c7;
            color: white;
            padding: 12px 20px;
            border-radius: 7px;
            font-weight: bold;
            margin-top: 15px;
        }

        .primary-btn:hover {
            background: #0369a1;
        }

        /* QUESTIONS */
        .question-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .question {
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            padding: 18px;
        }

        .question-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 12px;
        }

        .question-title {
            font-weight: bold;
            line-height: 1.5;
        }

        .badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .options {
            margin: 10px 0;
            padding-left: 20px;
            line-height: 1.8;
            color: #475569;
        }

        .correct {
            color: #15803d;
            font-weight: bold;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        /* STATUS */
        #message {
            display: none;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        /* MOBILE */
        @media (max-width: 800px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            header {
                padding: 15px;
            }

            .logo {
                font-size: 19px;
            }

            #adminName {
                display: none;
            }

            .container {
                width: 94%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        StudyHub <span>NG</span>
    </div>

    <div class="header-right">
        <span id="adminName">Checking admin...</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</header>

<main class="container">

    <div class="page-title">
        <h1>Admin Dashboard</h1>
        <p>Manage StudyHub NG questions and examination content.</p>
    </div>

    <div id="message"></div>

    <!-- STATISTICS -->
    <section class="stats">

        <div class="stat-card">
            <h3>Total Questions</h3>
            <strong id="totalQuestions">0</strong>
        </div>

        <div class="stat-card">
            <h3>WAEC Questions</h3>
            <strong id="waecQuestions">0</strong>
        </div>

        <div class="stat-card">
            <h3>JAMB Questions</h3>
            <strong id="jambQuestions">0</strong>
        </div>

    </section>

    <!-- ADD QUESTION -->
    <section class="card">

        <h2>Add Question</h2>

        <form id="questionForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="exam">Exam</label>

                    <select id="exam" required>
                        <option value="">Select Exam</option>
                        <option value="WAEC">WAEC</option>
                        <option value="JAMB">JAMB</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>

                    <input
                        type="text"
                        id="subject"
                        placeholder="Example: Biology"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="topic">Topic</label>

                    <input
                        type="text"
                        id="topic"
                        placeholder="Example: Cell Biology"
                    >
                </div>

                <div class="form-group">
                    <label for="difficulty">Difficulty</label>

                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label for="question">Question</label>

                    <textarea
                        id="question"
                        placeholder="Enter the question..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="option_a">Option A</label>
                    <input id="option_a" required>
                </div>

                <div class="form-group">
                    <label for="option_b">Option B</label>
                    <input id="option_b" required>
                </div>

                <div class="form-group">
                    <label for="option_c">Option C</label>
                    <input id="option_c" required>
                </div>

                <div class="form-group">
                    <label for="option_d">Option D</label>
                    <input id="option_d" required>
                </div>

                <div class="form-group">
                    <label for="correct_answer">Correct Answer</label>

                    <select id="correct_answer" required>
                        <option value="">Select Answer</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="explanation">Explanation</label>
                    <input
                        id="explanation"
                        placeholder="Optional explanation"
                    >
                </div>

            </div>

            <button class="primary-btn" type="submit">
                Add Question
            </button>

        </form>

    </section>

    <!-- QUESTIONS -->
    <section class="card">

        <h2>Question Bank</h2>

        <div class="question-list" id="questionList">
            <div class="loading">
                Loading questions...
            </div>
        </div>

    </section>

</main>

<script>
"use strict";

/*
    STUDYHUB NG ADMIN DASHBOARD
    ----------------------------
    This page:
    1. Checks /api/me
    2. Requires role === "admin"
    3. Loads admin questions
    4. Allows adding questions
    5. Allows deleting questions
    6. Allows admin logout
*/

const messageBox = document.getElementById("message");
const questionList = document.getElementById("questionList");

function showMessage(message, type = "success") {
    messageBox.textContent = message;
    messageBox.className = type;
}

function clearMessage() {
    messageBox.textContent = "";
    messageBox.className = "";
}

/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin() {

    try {

        const response = await fetch("/api/me", {
            method: "GET",
            credentials: "include"
        });

        if (!response.ok) {
            window.location.href = "login.html";
            return false;
        }

        const data = await response.json();

        console.log("Current user:", data);

        if (!data.user) {
            window.location.href = "login.html";
            return false;
        }

        if (data.user.role !== "admin") {

            alert("Admin access required.");

            window.location.href = "dashboard.html";

            return false;
        }

        document.getElementById("adminName").textContent =
            data.user.name || data.user.email || "Administrator";

        return true;

    } catch (error) {

        console.error("Admin check failed:", error);

        window.location.href = "login.html";

        return false;
    }
}


/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions() {

    questionList.innerHTML =
        '<div class="loading">Loading questions...</div>';

    try {

        const response = await fetch(
            "/api/admin/questions",
            {
                credentials: "include"
            }
        );

        if (response.status === 401) {
            window.location.href = "login.html";
            return;
        }

        if (response.status === 403) {
            window.location.href = "dashboard.html";
            return;
        }

        const data = await response.json();

        console.log("Admin questions:", data);

        let questions = [];

        if (Array.isArray(data)) {
            questions = data;
        } else if (Array.isArray(data.questions)) {
            questions = data.questions;
        }

        displayQuestions(questions);

    } catch (error) {

        console.error("Question loading error:", error);

        questionList.innerHTML =
            '<div class="loading">Could not load questions.</div>';
    }
}


/* =========================
   DISPLAY QUESTIONS
========================= */

function displayQuestions(questions) {

    questionList.innerHTML = "";

    if (!questions.length) {

        questionList.innerHTML =
            '<div class="loading">No questions found.</div>';

        updateStats([]);

        return;
    }

    questions.forEach(question => {

        const div = document.createElement("div");

        div.className = "question";

        const correct =
            question.correct_answer ||
            question.correctAnswer ||
            "";

        div.innerHTML = `
            <div class="question-top">

                <div class="question-title">
                    ${escapeHTML(question.question || "")}
                </div>

                <span class="badge">
                    ${escapeHTML(question.exam || "")}
                    -
                    ${escapeHTML(question.subject || "")}
                </span>

            </div>

            <div class="options">

                <div>A. ${escapeHTML(question.option_a || "")}</div>

                <div>B. ${escapeHTML(question.option_b || "")}</div>

                <div>C. ${escapeHTML(question.option_c || "")}</div>

                <div>D. ${escapeHTML(question.option_d || "")}</div>

            </div>

            <div class="correct">
                Correct answer: ${escapeHTML(correct)}
            </div>

            <button
                class="delete-btn"
                onclick="deleteQuestion(${Number(question.id)})"
            >
                Delete
            </button>
        `;

        questionList.appendChild(div);
    });

    updateStats(questions);
}


/* =========================
   STATISTICS
========================= */

function updateStats(questions) {

    const total = questions.length;

    const waec = questions.filter(
        q => String(q.exam).toUpperCase() === "WAEC"
    ).length;

    const jamb = questions.filter(
        q => String(q.exam).toUpperCase() === "JAMB"
    ).length;

    document.getElementById("totalQuestions").textContent = total;
    document.getElementById("waecQuestions").textContent = waec;
    document.getElementById("jambQuestions").textContent = jamb;
}


/* =========================
   ADD QUESTION
========================= */

document.getElementById("questionForm")
    .addEventListener("submit", async function(event) {

    event.preventDefault();

    clearMessage();

    const questionData = {

        exam:
            document.getElementById("exam").value,

        subject:
            document.getElementById("subject").value.trim(),

        topic:
            document.getElementById("topic").value.trim(),

        difficulty:
            document.getElementById("difficulty").value,

        question:
            document.getElementById("question").value.trim(),

        option_a:
            document.getElementById("option_a").value.trim(),

        option_b:
            document.getElementById("option_b").value.trim(),

        option_c:
            document.getElementById("option_c").value.trim(),

        option_d:
            document.getElementById("option_d").value.trim(),

        correct_answer:
            document.getElementById("correct_answer").value,

        explanation:
            document.getElementById("explanation").value.trim()
    };

    try {

        const response = await fetch(
            "/api/admin/questions",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify(questionData)
            }
        );

        const data = await response.json();

        if (!response.ok) {

            if (response.status === 401) {
                window.location.href = "login.html";
                return;
            }

            if (response.status === 403) {
                window.location.href = "dashboard.html";
                return;
            }

            throw new Error(
                data.message ||
                "Could not add question."
            );
        }

        showMessage(
            "Question added successfully.",
            "success"
        );

        document.getElementById("questionForm").reset();

        await loadQuestions();

    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Could not add question.",
            "error"
        );
    }
});


/* =========================
   DELETE QUESTION
========================= */

async function deleteQuestion(id) {

    if (!id) {
        return;
    }

    const confirmed = confirm(
        "Are you sure you want to delete this question?"
    );

    if (!confirmed) {
        return;
    }

    try {

        const response = await fetch(
            "/api/admin/questions/" + encodeURIComponent(id),
            {
                method: "DELETE",
                credentials: "include"
            }
        );

        const data = await response.json();

        if (!response.ok) {

            if (response.status === 401) {
                window.location.href = "login.html";
                return;
            }

            if (response.status === 403) {
                window.location.href = "dashboard.html";
                return;
            }

            throw new Error(
                data.message ||
                "Could not delete question."
            );
        }

        showMessage(
            "Question deleted successfully.",
            "success"
        );

        await loadQuestions();

    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Could not delete question.",
            "error"
        );
    }
}


/* =========================
   LOGOUT
========================= */

async function logout() {

    try {

        await fetch(
            "/api/logout",
            {
                method: "POST",
                credentials: "include"
            }
        );

    } catch (error) {

        console.error(
            "Logout error:",
            error
        );

    } finally {

        window.location.href = "login.html";
    }
}


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

    const div = document.createElement("div");

    div.textContent = value == null
        ? ""
        : String(value);

    return div.innerHTML;
}


/* =========================
   START
========================= */

async function startAdmin() {

    const isAdmin = await checkAdmin();

    if (!isAdmin) {
        return;
    }

    await loadQuestions();
}

startAdmin();
</script>

</body>
</html>
