<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyHub NG - Practice</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
    min-height:100vh;
}

header{
    background:#0b5ed7;
    color:white;
    padding:16px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.logo{
    font-size:24px;
    font-weight:800;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:18px;
    font-weight:600;
}

.container{
    width:min(900px,92%);
    margin:35px auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:28px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
    margin-bottom:20px;
}

h1{
    font-size:30px;
    margin-bottom:8px;
}

h2{
    margin-bottom:12px;
}

.subtitle{
    color:#667085;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:700;
    margin:18px 0 8px;
}

select{
    width:100%;
    padding:13px;
    border:1px solid #ccd3df;
    border-radius:10px;
    font-size:16px;
    background:white;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.primary{
    background:#0b5ed7;
    color:white;
}

.secondary{
    background:#e9eef6;
    color:#172033;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.actions{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:25px;
}

.hidden{
    display:none!important;
}

.error{
    background:#fff1f2;
    color:#b42318;
    border:1px solid #fda4af;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
}

.info{
    background:#eef6ff;
    border:1px solid #bfdbfe;
    padding:14px;
    border-radius:10px;
    margin-top:18px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.badge{
    background:#e8f1ff;
    color:#0b5ed7;
    padding:8px 12px;
    border-radius:20px;
    font-weight:700;
}

.progress{
    height:9px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
    margin:15px 0 25px;
}

.progress-bar{
    height:100%;
    width:0;
    background:#0b5ed7;
    transition:.3s;
}

.question{
    font-size:21px;
    line-height:1.5;
    font-weight:700;
    margin-bottom:22px;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    background:#f8fafc;
    border:2px solid #e2e8f0;
    margin:10px 0;
    color:#172033;
}

.option:hover{
    border-color:#0b5ed7;
}

.option.selected{
    border-color:#0b5ed7;
    background:#eaf2ff;
}

.result{
    text-align:center;
}

.score{
    font-size:52px;
    font-weight:800;
    color:#0b5ed7;
    margin:15px 0;
}

.result p{
    margin:8px 0;
    color:#667085;
}

.loading{
    color:#667085;
    font-size:14px;
    margin-top:8px;
}

.exam-choice{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:10px;
}

.exam-button{
    background:white;
    color:#172033;
    border:2px solid #d0d7e2;
    padding:20px;
    text-align:left;
    border-radius:12px;
}

.exam-button strong{
    display:block;
    font-size:19px;
    margin-bottom:6px;
}

.exam-button span{
    display:block;
    color:#667085;
    font-size:14px;
    font-weight:normal;
}

.exam-button:hover{
    border-color:#0b5ed7;
}

.exam-button.selected{
    border-color:#0b5ed7;
    background:#eef5ff;
}

@media(max-width:600px){

    .card{
        padding:20px;
    }

    h1{
        font-size:25px;
    }

    .question{
        font-size:18px;
    }

    .actions{
        flex-direction:column;
    }

    .actions button{
        width:100%;
    }

    nav{
        width:100%;
    }

    nav a{
        margin:0 12px 0 0;
    }

    .exam-choice{
        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<header>

    <div class="logo">
        StudyHub NG
    </div>

    <nav>
        <a href="dashboard.html">Home</a>
        <a href="practice.html">Practice</a>
        <a href="results.html">Results</a>
    </nav>

</header>


<main class="container">


<!-- ==================================================
     SETUP
================================================== -->

<section id="setupCard" class="card">

    <h1>Practice Exam</h1>

    <p class="subtitle">
        Choose JAMB or WAEC, select a subject, and start practicing.
    </p>


    <label>
        Choose Examination
    </label>


    <div class="exam-choice">

        <button
            type="button"
            id="jambButton"
            class="exam-button"
        >

            <strong>JAMB Practice</strong>

            <span>
                Practice JAMB examination questions
            </span>

        </button>


        <button
            type="button"
            id="waecButton"
            class="exam-button"
        >

            <strong>WAEC Practice</strong>

            <span>
                Practice WAEC examination questions
            </span>

        </button>

    </div>


    <!-- Hidden value used by JavaScript -->

    <input
        type="hidden"
        id="exam"
        value=""
    >


    <div
        id="selectedExamText"
        class="info hidden"
    ></div>


    <label for="subject">
        Subject
    </label>


    <select
        id="subject"
        disabled
    >

        <option value="">
            Select JAMB or WAEC first
        </option>

    </select>


    <div
        id="subjectLoading"
        class="loading hidden"
    >
        Loading subjects...
    </div>


    <label for="limit">
        Number of Questions
    </label>


    <select id="limit">

        <option value="10">
            10 Questions
        </option>

        <option value="20">
            20 Questions
        </option>

        <option value="30">
            30 Questions
        </option>

        <option value="50">
            50 Questions
        </option>

        <option value="100">
            100 Questions
        </option>

    </select>


    <button
        id="startBtn"
        class="primary"
        style="margin-top:25px;width:100%"
    >
        Start Practice
    </button>


    <div
        id="errorBox"
        class="error hidden"
    ></div>

</section>


<!-- ==================================================
     QUIZ
================================================== -->

<section
    id="quizCard"
    class="card hidden"
>

    <div class="topbar">

        <span
            id="examBadge"
            class="badge"
        >
            JAMB
        </span>


        <span
            id="questionCounter"
            class="badge"
        >
            Question 1 of 10
        </span>

    </div>


    <div class="progress">

        <div
            id="progressBar"
            class="progress-bar"
        ></div>

    </div>


    <div
        id="questionText"
        class="question"
    ></div>


    <div id="options"></div>


    <div class="actions">

        <button
            id="prevBtn"
            class="secondary"
        >
            Previous
        </button>


        <button
            id="nextBtn"
            class="primary"
        >
            Next
        </button>

    </div>

</section>


<!-- ==================================================
     RESULT
================================================== -->

<section
    id="resultCard"
    class="card result hidden"
>

    <h2>
        Practice Complete 🎉
    </h2>


    <div
        id="scoreText"
        class="score"
    >
        0%
    </div>


    <p id="resultDetails"></p>

    <p id="resultMessage"></p>


    <div class="actions">

        <button
            id="reviewBtn"
            class="secondary"
        >
            Review Answers
        </button>


        <button
            id="restartBtn"
            class="primary"
        >
            Try Again
        </button>

    </div>

</section>


</main>


<script>

/* =====================================================
   STUDYHUB NG PRACTICE
===================================================== */

let questions = [];

let answers = [];

let currentQuestion = 0;

let score = 0;

let selectedExam = "";

let selectedSubject = "";

let lastResultId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const examInput =
    document.getElementById("exam");

const jambButton =
    document.getElementById("jambButton");

const waecButton =
    document.getElementById("waecButton");

const selectedExamText =
    document.getElementById("selectedExamText");

const subjectSelect =
    document.getElementById("subject");

const limitSelect =
    document.getElementById("limit");

const startBtn =
    document.getElementById("startBtn");

const setupCard =
    document.getElementById("setupCard");

const quizCard =
    document.getElementById("quizCard");

const resultCard =
    document.getElementById("resultCard");

const subjectLoading =
    document.getElementById("subjectLoading");

const errorBox =
    document.getElementById("errorBox");

const examBadge =
    document.getElementById("examBadge");

const questionCounter =
    document.getElementById("questionCounter");

const progressBar =
    document.getElementById("progressBar");

const questionText =
    document.getElementById("questionText");

const optionsContainer =
    document.getElementById("options");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const scoreText =
    document.getElementById("scoreText");

const resultDetails =
    document.getElementById("resultDetails");

const resultMessage =
    document.getElementById("resultMessage");

const reviewBtn =
    document.getElementById("reviewBtn");

const restartBtn =
    document.getElementById("restartBtn");


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        const loggedIn =
            await checkLogin();

        if(!loggedIn){
            return;
        }

        setupEvents();

    }
);


/* =====================================================
   LOGIN CHECK
===================================================== */

async function checkLogin(){

    try{

        const response =
            await fetch("/api/me");

        if(!response.ok){

            window.location.href =
                "/login.html";

            return false;
        }

        return true;

    }catch(error){

        console.error(
            "Login check error:",
            error
        );

        showError(
            "Unable to check your login session."
        );

        return false;
    }
}


/* =====================================================
   EVENTS
===================================================== */

function setupEvents(){

    jambButton.addEventListener(
        "click",
        function(){

            chooseExam("JAMB");

        }
    );


    waecButton.addEventListener(
        "click",
        function(){

            chooseExam("WAEC");

        }
    );


    startBtn.addEventListener(
        "click",
        startPractice
    );


    prevBtn.addEventListener(
        "click",
        previousQuestion
    );


    nextBtn.addEventListener(
        "click",
        nextQuestion
    );


    reviewBtn.addEventListener(
        "click",
        reviewExam
    );


    restartBtn.addEventListener(
        "click",
        restartPractice
    );

}


/* =====================================================
   CHOOSE EXAM
===================================================== */

async function chooseExam(exam){

    selectedExam = exam;

    examInput.value = exam;


    jambButton.classList.remove(
        "selected"
    );

    waecButton.classList.remove(
        "selected"
    );


    if(exam === "JAMB"){

        jambButton.classList.add(
            "selected"
        );

    }


    if(exam === "WAEC"){

        waecButton.classList.add(
            "selected"
        );

    }


    selectedExamText.textContent =
        `${exam} Practice selected`;

    selectedExamText.classList.remove(
        "hidden"
    );


    await loadSubjects(exam);

}


/* =====================================================
   LOAD SUBJECTS
===================================================== */

async function loadSubjects(exam){

    subjectSelect.innerHTML =
        `<option value="">
            Loading subjects...
        </option>`;

    subjectSelect.disabled = true;


    if(!exam){

        subjectSelect.innerHTML =
            `<option value="">
                Select JAMB or WAEC first
            </option>`;

        return;
    }


    subjectLoading.classList.remove(
        "hidden"
    );


    try{

        const response =
            await fetch(
                `/api/subjects?exam=${encodeURIComponent(exam)}`
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load subjects."
            );

        }


        let subjects = [];


        if(
            Array.isArray(data.subjects)
        ){

            subjects =
                data.subjects;

        }else if(
            Array.isArray(data)
        ){

            subjects =
                data;

        }


        subjectSelect.innerHTML =
            `<option value="">
                Select subject
            </option>`;


        subjects.forEach(
            function(subject){

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    subject;

                option.textContent =
                    subject;

                subjectSelect.appendChild(
                    option
                );

            }
        );


        if(subjects.length === 0){

            subjectSelect.innerHTML =
                `<option value="">
                    No subjects found
                </option>`;

            showError(
                `No ${exam} subjects were found in the question database yet.`
            );

        }


        subjectSelect.disabled =
            false;


    }catch(error){

        console.error(
            "Subject loading error:",
            error
        );


        subjectSelect.innerHTML =
            `<option value="">
                Unable to load subjects
            </option>`;


        showError(
            "Unable to load subjects."
        );


    }finally{

        subjectLoading.classList.add(
            "hidden"
        );

    }

}


/* =====================================================
   START PRACTICE
===================================================== */

async function startPractice(){

    hideError();


    selectedExam =
        examInput.value.trim();


    selectedSubject =
        subjectSelect.value.trim();


    const limit =
        parseInt(
            limitSelect.value,
            10
        );


    if(!selectedExam){

        showError(
            "Please choose JAMB Practice or WAEC Practice."
        );

        return;
    }


    if(!selectedSubject){

        showError(
            "Please select a subject."
        );

        return;
    }


    startBtn.disabled = true;

    startBtn.textContent =
        "Loading Questions...";


    try{

        const url =
            `/api/questions?exam=${encodeURIComponent(selectedExam)}` +
            `&subject=${encodeURIComponent(selectedSubject)}` +
            `&limit=${limit}`;


        console.log(
            "Question API:",
            url
        );


        const response =
            await fetch(url);


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to load questions."
            );

        }


        if(
            Array.isArray(data.questions)
        ){

            questions =
                data.questions;

        }else if(
            Array.isArray(data)
        ){

            questions =
                data;

        }else{

            questions = [];

        }


        if(
            questions.length === 0
        ){

            showError(
                `No questions were found for ${selectedExam} - ${selectedSubject}.`
            );

            return;
        }


        currentQuestion = 0;

        score = 0;

        answers =
            new Array(
                questions.length
            ).fill("");


        examBadge.textContent =
            `${selectedExam} - ${selectedSubject}`;


        setupCard.classList.add(
            "hidden"
        );


        resultCard.classList.add(
            "hidden"
        );


        quizCard.classList.remove(
            "hidden"
        );


        renderQuestion();


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });


    }catch(error){

        console.error(
            "Start practice error:",
            error
        );


        showError(
            error.message ||
            "Unable to load questions."
        );


    }finally{

        startBtn.disabled = false;

        startBtn.textContent =
            "Start Practice";

    }

}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

    if(
        questions.length === 0
    ){
        return;
    }


    const question =
        questions[currentQuestion];


    if(!question){
        return;
    }


    questionCounter.textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;


    const progress =
        (
            (currentQuestion + 1) /
            questions.length
        ) * 100;


    progressBar.style.width =
        `${progress}%`;


    questionText.textContent =
        question.question ||
        question.question_text ||
        question.text ||
        "Question unavailable";


    optionsContainer.innerHTML =
        "";


    const options =
        getOptions(question);


    const letters =
        ["A","B","C","D"];


    letters.forEach(
        function(letter){

            const value =
                options[letter];


            if(
                value === undefined ||
                value === null ||
                value === ""
            ){
                return;
            }


            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "option";


            button.textContent =
                `${letter}. ${value}`;


            if(
                answers[currentQuestion] ===
                letter
            ){

                button.classList.add(
                    "selected"
                );

            }


            button.addEventListener(
                "click",
                function(){

                    selectAnswer(
                        letter
                    );

                }
            );


            optionsContainer.appendChild(
                button
            );

        }
    );


    updateNavigation();

}


/* =====================================================
   OPTIONS
===================================================== */

function getOptions(question){

    const nested =
        question.options || {};


    return {

        A:
            question.option_a ??
            question.optionA ??
            nested.A ??
            nested.a ??
            "",

        B:
            question.option_b ??
            question.optionB ??
            nested.B ??
            nested.b ??
            "",

        C:
            question.option_c ??
            question.optionC ??
            nested.C ??
            nested.c ??
            "",

        D:
            question.option_d ??
            question.optionD ??
            nested.D ??
            nested.d ??
            ""

    };

}


/* =====================================================
   SELECT ANSWER
===================================================== */

function selectAnswer(letter){

    answers[currentQuestion] =
        letter;

    renderQuestion();

}


/* =====================================================
   NAVIGATION
===================================================== */

function updateNavigation(){

    prevBtn.disabled =
        currentQuestion === 0;


    if(
        currentQuestion ===
        questions.length - 1
    ){

        nextBtn.textContent =
            "Finish Exam";

    }else{

        nextBtn.textContent =
            "Next";

    }

}


/* =====================================================
   NEXT QUESTION
===================================================== */

async function nextQuestion(){

    if(
        currentQuestion <
        questions.length - 1
    ){

        currentQuestion++;

        renderQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

        return;
    }


    await finishExam();

}


/* =====================================================
   PREVIOUS QUESTION
===================================================== */

function previousQuestion(){

    if(
        currentQuestion > 0
    ){

        currentQuestion--;

        renderQuestion();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =====================================================
   FINISH EXAM
===================================================== */

async function finishExam(){

    if(
        questions.length === 0
    ){

        showError(
            "There are no questions to submit."
        );

        return;
    }


    const unanswered =
        questions.filter(
            function(_,index){

                return !answers[index];

            }
        ).length;


    if(
        unanswered > 0
    ){

        const confirmed =
            confirm(
                `You have ${unanswered} unanswered question(s).\n\nDo you want to submit the exam anyway?`
            );


        if(!confirmed){
            return;
        }

    }


    nextBtn.disabled = true;

    prevBtn.disabled = true;

    nextBtn.textContent =
        "Submitting...";


    try{

        const questionIds =
            questions.map(
                function(question){

                    return Number(
                        question.id
                    );

                }
            );


        const submittedAnswers =
            questions.map(
                function(_,index){

                    return (
                        answers[index] ||
                        ""
                    );

                }
            );


        if(
            questionIds.some(
                function(id){

                    return !Number.isInteger(
                        id
                    );

                }
            )
        ){

            throw new Error(
                "A question has an invalid database ID."
            );

        }


        const response =
            await fetch(
                "/api/submit-quiz",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        exam:
                            selectedExam,

                        subject:
                            selectedSubject,

                        questionIds:
                            questionIds,

                        answers:
                            submittedAnswers

                    })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            if(
                response.status === 401
            ){

                alert(
                    "Your login session has expired. Please login again."
                );

                window.location.href =
                    "/login.html";

                return;
            }


            throw new Error(
                data.message ||
                "Unable to save your result."
            );

        }


        score =
            Number(
                data.correctAnswers || 0
            );


        const totalQuestions =
            Number(
                data.totalQuestions ||
                questions.length
            );


        const percentage =
            Number(
                data.percentage || 0
            );


        lastResultId =
            data.resultId || null;


        if(lastResultId){

            sessionStorage.setItem(
                "lastResultId",
                String(lastResultId)
            );

        }


        quizCard.classList.add(
            "hidden"
        );


        resultCard.classList.remove(
            "hidden"
        );


        scoreText.textContent =
            `${percentage}%`;


        resultDetails.textContent =
            `${score} correct out of ${totalQuestions} questions.`;


        if(
            percentage >= 80
        ){

            resultMessage.textContent =
                "Excellent work! You reached your 80% target.";

        }else if(
            percentage >= 60
        ){

            resultMessage.textContent =
                "Good effort! Keep practicing to improve.";

        }else{

            resultMessage.textContent =
                "Keep practicing. You can improve your score.";

        }


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });


    }catch(error){

        console.error(
            "Submit quiz error:",
            error
        );


        showError(
            error.message ||
            "Something went wrong while submitting the exam."
        );


    }finally{

        nextBtn.disabled = false;

        prevBtn.disabled = false;

        updateNavigation();

    }

}


/* =====================================================
   REVIEW
===================================================== */

function reviewExam(){

    resultCard.classList.add(
        "hidden"
    );


    quizCard.classList.remove(
        "hidden"
    );


    renderQuestion();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   RESTART
===================================================== */

function restartPractice(){

    questions = [];

    answers = [];

    currentQuestion = 0;

    score = 0;

    selectedExam = "";

    selectedSubject = "";

    lastResultId = null;


    examInput.value = "";


    jambButton.classList.remove(
        "selected"
    );


    waecButton.classList.remove(
        "selected"
    );


    selectedExamText.textContent =
        "";

    selectedExamText.classList.add(
        "hidden"
    );


    subjectSelect.innerHTML =
        `<option value="">
            Select JAMB or WAEC first
        </option>`;


    subjectSelect.disabled =
        true;


    quizCard.classList.add(
        "hidden"
    );


    resultCard.classList.add(
        "hidden"
    );


    setupCard.classList.remove(
        "hidden"
    );


    hideError();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   ERROR
===================================================== */

function showError(message){

    errorBox.textContent =
        message;

    errorBox.classList.remove(
        "hidden"
    );

}


function hideError(){

    errorBox.textContent =
        "";

    errorBox.classList.add(
        "hidden"
    );

}

</script>

</body>
</html>
