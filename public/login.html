<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — StudyHub NG</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Study<span>Hub</span> NG
    </div>

    <a href="index.html" class="man"> Back to Home</a>

</header>


<main class="auth-page">

    <div class="auth-box">

        <h1>Welcome back</h1>

        <p>
            Log in to continue your learning journey.
        </p>


        <form id="loginForm">

            <label>Email Address</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-btn"
            >
                Log In
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </p>

    </div>

</main>


<script src="js/main.js"></script>

</body>
</html>
