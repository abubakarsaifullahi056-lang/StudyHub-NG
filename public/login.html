</div>

<script>

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";
}

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showMessage("Please enter your email and password.", "error");
        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    try {

        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Login failed.");
        }

        showMessage("Login successful. Redirecting...", "success");

        /*
         * Check the actual logged-in user from the server.
         * This prevents an admin from accidentally being
         * redirected to the normal student dashboard.
         */

        const meResponse = await fetch("/api/me", {
            method: "GET",
            credentials: "include"
        });

        const meData = await meResponse.json();

        const role = meData.user?.role || data.user?.role || data.role;

        setTimeout(() => {

            if (role === "admin") {

                // ADMIN → ADMIN PAGE
                window.location.href = "admin.html";

            } else {

                // STUDENT → STUDENT DASHBOARD
                window.location.href = "dashboard.html";

            }

        }, 500);

    } catch (error) {

        console.error("Login error:", error);

        showMessage(
            error.message || "Something went wrong during login.",
            "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "Login";
    }

});

</script>
