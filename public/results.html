<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Results - StudyHub NG</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav a,
        nav button {
            text-decoration: none;
            border: none;
            background: white;
            color: #0b5ed7;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        nav a:hover,
        nav button:hover {
            background: #e9f2ff;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .top-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .top-section h2 {
            margin-bottom: 8px;
        }

        .top-section p {
            color: #666;
        }

        #message {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        #errorBox {
            display: none;
            background: #ffe5e5;
            color: #b00020;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .results-list {
            display: grid;
            gap: 18px;
        }

        .result-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .result-header h3 {
            font-size: 20px;
        }

        .percentage {
            font-size: 22px;
            font-weight: bold;
            color: #0b5ed7;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .detail-box {
            background: #f5f8fc;
            padding: 14px;
            border-radius: 8px;
        }

        .detail-box small {
            display: block;
            color: #777;
            margin-bottom: 5px;
        }

        .detail-box strong {
            font-size: 16px;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            border: none;
            cursor: pointer;
            padding: 10px 17px;
            border-radius: 7px;
            font-size: 14px;
        }

        .btn-primary {
            background: #0b5ed7;
            color: white;
        }

        .btn-primary:hover {
            background: #084db2;
        }

        .btn-secondary {
            background: #e9eef5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dce4ef;
        }

        .empty {
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .empty h3 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #666;
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 750px) {
            header {
                padding: 15px;
            }

            .container {
                width: 95%;
                margin: 20px auto;
            }

            .details {
                grid-template-columns: repeat(2, 1fr);
            }

            .result-header {
                align-items: flex-start;
            }
        }

        @media (max-width: 450px) {
            .details {
                grid-template-columns: 1fr;
            }

            nav {
                width: 100%;
            }

            nav a,
            nav button {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>StudyHub NG</h1>

    <nav>
        
        <a href="dashboard.html">Home</a>
        <a href="practice.html">Practice</a>
        <button onclick="logout()">Logout</button>
    </nav>
</header>

<main class="container">

    <section class="top-section">
        <h2>My Results</h2>
        <p>View your previous WAEC and JAMB practice results.</p>
    </section>

    <div id="errorBox"></div>

    <div id="loading">
        Loading your results...
    </div>

    <div id="resultsList" class="results-list"></div>

</main>

<footer>
    <p>© 2026 StudyHub NG. All rights reserved.</p>
</footer>

<script>

async function checkLogin() {

    try {

        const response = await fetch("/api/me", {
            credentials: "include"
        });

        if (!response.ok) {
            window.location.href = "login.html";
            return false;
        }

        return true;

    } catch (error) {

        showError(
            "Unable to connect to the server."
        );

        return false;
    }
}


async function loadResults() {

    const loading =
        document.getElementById("loading");

    const resultsList =
        document.getElementById("resultsList");

    try {

        const response = await fetch(
            "/api/results",
            {
                credentials: "include"
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load results."
            );
        }

        loading.style.display = "none";

        resultsList.innerHTML = "";

        const results =
            Array.isArray(data.results)
                ? data.results
                : [];

        if (results.length === 0) {

            resultsList.innerHTML = `
                <div class="empty">

                    <h3>No Results Yet</h3>

                    <p>
                        You have not completed any
                        practice exam yet.
                    </p>

                    <a
                        href="practice.html"
                        class="btn btn-primary"
                    >
                        Start Practice
                    </a>

                </div>
            `;

            return;
        }

        results.forEach(result => {

            const card =
                document.createElement("div");

            card.className = "result-card";

            const percentage =
                Number(result.percentage || 0);

            const correct =
                Number(result.correct_answers || 0);

            const total =
                Number(result.total_questions || 0);

            const score =
                result.score !== undefined &&
                result.score !== null
                    ? result.score
                    : correct;

            const date =
                formatDate(result.created_at);

            card.innerHTML = `

                <div class="result-header">

                    <div>
                        <h3>
                            ${escapeHTML(
                                result.exam || "Exam"
                            )}
                            -
                            ${escapeHTML(
                                result.subject || "Subject"
                            )}
                        </h3>

                        <p style="
                            color:#777;
                            margin-top:5px;
                        ">
                            ${date}
                        </p>
                    </div>

                    <div class="percentage">
                        ${percentage}%
                    </div>

                </div>

                <div class="details">

                    <div class="detail-box">
                        <small>Score</small>
                        <strong>
                            ${score}
                        </strong>
                    </div>

                    <div class="detail-box">
                        <small>Correct</small>
                        <strong>
                            ${correct}
                        </strong>
                    </div>

                    <div class="detail-box">
                        <small>Total Questions</small>
                        <strong>
                            ${total}
                        </strong>
                    </div>

                    <div class="detail-box">
                        <small>Percentage</small>
                        <strong>
                            ${percentage}%
                        </strong>
                    </div>

                </div>

                <div class="result-actions">

                    <a
                        class="btn btn-primary"
                        href="result-details.html?id=${encodeURIComponent(result.id)}"
                    >
                        View Details
                    </a>

                    <a
                        class="btn btn-secondary"
                        href="practice.html"
                    >
                        Practice Again
                    </a>

                </div>

            `;

            resultsList.appendChild(card);

        });

    } catch (error) {

        loading.style.display = "none";

        showError(
            error.message ||
            "Unable to load results."
        );
    }
}


function formatDate(dateString) {

    if (!dateString) {
        return "Date unavailable";
    }

    const date =
        new Date(dateString);

    if (isNaN(date.getTime())) {
        return dateString;
    }

    return date.toLocaleString(
        "en-NG",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );
}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function showError(message) {

    const errorBox =
        document.getElementById("errorBox");

    errorBox.textContent = message;

    errorBox.style.display = "block";
}


async function logout() {

    try {

        await fetch(
            "/api/logout",
            {
                method: "POST",
                credentials: "include"
            }
        );

    } catch (error) {

        console.error(error);

    }

    window.location.href =
        "login.html";
}


async function startPage() {

    const loggedIn =
        await checkLogin();

    if (!loggedIn) {
        return;
    }

    await loadResults();
}


startPage();

</script>

</body>
</html>
